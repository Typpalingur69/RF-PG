<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Font Pairing Generator</title>
<style id="font-faces"></style>
<style>
    :root {
        --primary-900: #000;
        --primary-400: #d1d1d1;
        --primary-300: #fff;
 
        --surface-1: var(--primary-900);
 
        --border-1: var(--primary-300); /*top*/
        --border-2: var(--primary-400); /*bottom*/
 
        --row: 120px;  /* hæðin á öllum 4 rows */
        --rail: 55px;  /* width á button panel */
    }
 
    * { box-sizing: border-box; }
    * { font-family: inherit; font-size: inherit; font-weight: inherit; }
    html {
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    body { margin: 0; font-family: "Helvetica"; font-size: 12px; font-weight: 500; background-color: #fff; color:#000;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
        display: none;
    }
 
    /* First screen: 1 viewport hár, contents centered í því */
    .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 8px;
    }
 
    .logo { position: absolute; left: 30px; top: 30px; }
 
    .logo h1 { margin: 0; font-size: 25px; font-weight: 500;}
 
    /* 4-row grid: [save] [font 1 + lock] [font 2 + lock] [edit] */
    .stage {
        margin-top: auto;
        margin-bottom: calc(var(--row) * -1);
        width: 100%;
        padding: 0 35px 0 25px;
        display: grid;
        grid-template-columns: 1fr var(--rail);
        grid-template-rows: repeat(4, var(--row));
    }
 
    /* Shared icon-button st+ilar (lock, save, edit) */
    .icon-btn {
        position: relative;
        z-index: 1;
        background: none;
        padding: 4px 10px;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
    }
    .icon-btn img { display: block; width: 24px; height: 24px; }
    .save-pair-btn { grid-column: 2; grid-row: 1; place-self: center; }
    .edit-toggle-btn { grid-column: 2; grid-row: 4; place-self: center; }
    .lock-btn { grid-column: 2; place-self: center; border-radius: 0; translate: -5px 0; } 
 
 
    .icon-btn img:hover, 
    .remove-pair-btn:hover { transform: scale(1.05) perspective(1px); }
    .randomize:hover { transform: translateX(-32.5px) scale(1.05) perspective(1px); }
 
    button:focus,
    [contenteditable="true"]:focus {
        outline: none !important;
        box-shadow: none !important;
        border-color: transparent !important;
    }
 
    /* Generate takki, space er main trigger */
    .randomize {
        margin: auto 0;
        border-radius: 999px;
        padding: 10px 16px;
        background-color: transparent;
        color: #666;
        border: 1px solid transparent;
        cursor: pointer;
        text-align: center;
        transform: translateX(-32.5px);
    }
 
    .output-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: subgrid;
        align-items: center;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
    }
    .row-1 { grid-row: 2; }
    .row-2 { grid-row: 3; }
 
    .output-row h1 {
        grid-column: 1;
        pointer-events: none;
        width: 100%;
        font-size: clamp(24px, 5vw, 100px);
        line-height: 1.1;
        text-align: center;
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
    }
 
    /* Edit mode: outputs verða textboxes */
    h1.edit-mode {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100px;
        font-size: clamp(20px, 2.6vw, 40px);
        padding: 0 15px;
        overflow-y: auto;
        text-align: center;
        width: 80%;
        margin: 0 auto;
        cursor: text;
        border: 1px dashed #666;
        border-radius: 25px;
    }
    .edit-mode:empty::before { content: attr(data-placeholder); color: #999; }
 
    /* Saved pairings sit below the first screen */
    .my-fonts-section {
        width: 100%;
        padding: 27px;
        color: #666;
        background: #000;
    }
 
    .my-fonts-list {
        width: 100%;
        padding-top: 12px;
        display: grid;
        gap: 8px;
    }
 
    .my-font-card {
        padding: 10px 10px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #fff;
        min-height: 72px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        transform: translateX(-32.5px);
    }
 
    .empty-state { color: #666; text-align: center; transform: translateX(-32.5px); }
 
    .saved-pair-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
    }
 
    .saved-pair-output {
        min-height: 24px;
        text-align: center;
        font-size: clamp(12px, 1.7vw, 18px);
        line-height: 1.15;
        overflow-wrap: anywhere;
        padding: 2px 0;
        transform: translateZ(0);
    }
 
    .saved-pair-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: baseline;
        width: 100%;
    }
 
    .saved-pair-line .saved-pair-output { grid-column: 2; width: auto; }
 
    .saved-credit {
        grid-column: 3;
        justify-self: start;
        margin-left: 12px;
        white-space: nowrap;
        color: #666;
    }
 
    .remove-pair-btn {
        align-self: center;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        border-radius: 999px;
        padding: 4px 8px;
        cursor: pointer;
    }
 
    /*---------------------------------------------------------------
Panel fyrir takkana*/
    .rail-bg {
        grid-column: 2;
        grid-row: 1 / -1;
        position: relative;
        border-radius: 25px;
        overflow: hidden;
        background: hsl(from var(--surface-1) h s l  / 0.03);
    }
 
    .rail-bg::before {
        content: "";
        border: 0.5px solid transparent;
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(var(--border-1), var(--border-2)) border-box;
        -webkit-mask:
            linear-gradient(#000 0 0) padding-box,
            linear-gradient(#000 0 0) border-box;
        -webkit-mask-composite: xor;
        mask-composite: exclude;
    }
 
    .arrow-link { margin-bottom: 3vh; transform: translateX(-32.5px); }
    .arrow { display: block; width: 20px; height: 20px; } 
    .arrow:hover { transform: scale(1.05) perspective(1px); }
 
    /* símar / þröngir gluggar */
    @media (max-width: 700px) {
        :root { --row: 96px; }
        .stage { padding: 0 35px; grid-template-columns: var(--rail) 1fr var(--rail); }
    }
</style>
</head>
<body>
    <main class="hero">
        <div class="logo">
            <h1 id="logoname">RF-PG</h1>
        </div>
 
        <div class="stage">
            <div class="rail-bg"></div>
 
            <button class="icon-btn save-pair-btn" id="saveBtn"><img src="icons/unsaved.svg" alt="Save this pairing"></button>
 
            <div class="output-row row-1">
                <h1 id="output" data-placeholder="Write something...">Font 1</h1>
                <button class="icon-btn lock-btn" id="lock1"><img src="icons/Asset 2.svg" alt="Unlock font 1"></button>
            </div>
            <div class="output-row row-2">
                <h1 id="output2" data-placeholder="Write something...">Font 2</h1>
                <button class="icon-btn lock-btn" id="lock2"><img src="icons/Asset 2.svg" alt="Unlock font 2"></button>
            </div>
 
            <button class="icon-btn edit-toggle-btn" id="editBtn"><img src="icons/edit-off.svg" alt="Turn outputs into textboxes"></button>
        </div>
 
        <button class="randomize" id="randomBtn">Press spacebar to randomize</button>
 
        <a class="arrow-link" href="#saved"><img class="arrow" src="icons/arrow.svg" alt="Scroll to saved pairings"></a>
    </main>
 
    <section class="my-fonts-section" id="saved">
        <div id="my-fonts-list" class="my-fonts-list"></div>
    </section>
 
<script>
// ---------------------------------------------------------------
// First kemur font name sem verður displayed,
//síðan kemur font name í font file.
// Optional third value = font-weight
// ---------------------------------------------------------------
const FONT_FILES = {
    "Courier Prime Bold": "CourierPrime-Bold.ttf",

    "Play Bold": "Play-Bold.ttf",
    "Pochaevsk": "Pochaevsk-Regular.ttf",
    "Rethink": "RethinkSans-VariableFont_wght.ttf",
    "Rethink Italic": "RethinkSans-Italic-VariableFont_wght.ttf",
    "Sen": "Sen-VariableFont_wght.ttf",
    "Space Mono Regular": "SpaceMono-Regular.ttf",
    "Space Mono Bold": "SpaceMono-Bold.ttf",
    "Space Mono Bold Italic": "SpaceMono-BoldItalic.ttf",
    "Space Mono Italic": "SpaceMono-Italic.ttf",
    "Special Gothic Expanded One": "SpecialGothicExpandedOne-Regular.ttf",
    "Squada One": "SquadaOne-Regular.ttf",
    "Tangerine Regular": "Tangerine-Regular.ttf",
    "Tangerine Bold": "Tangerine-Bold.ttf",
    "VT323": "VT323-Regular.ttf",
    "Wix Made for Text": "WixMadeForText-VariableFont_wght.ttf",
    "Wix Made for Text Italic": "WixMadeForText-Italic-VariableFont_wght.ttf",
    "Work Sans": "WorkSans-VariableFont_wght.ttf",
    "Work Sans Italic": "WorkSans-Italic-VariableFont_wght.ttf",
    "Idiqlat Extra Light": "Idiqlat-ExtraLight.ttf",
    "Idiqlat Light": "Idiqlat-Light.ttf",
    "Idiqlat Regular": "Idiqlat-Regular.ttf",
    "AlienBlock Regular": "AlienBlock-Regular.ttf",
    "Playwrite Cuba Guides": "PlaywriteCUGuides-Regular.ttf",
    "Archivo Black": "ArchivoBlack-Regular.ttf",
    "Lora Italic": "Lora-Italic-VariableFont_wght.ttf",
    "Lora Regular": "Lora-VariableFont_wght.ttf",
    "Bebas Neue": "BebasNeue-Regular.ttf",
    "Dancing Script": "DancingScript-VariableFont_wght.ttf",
    "Instrument Serif Italic": "InstrumentSerif-Italic.ttf",
    "Instrument Serif Regular": "InstrumentSerif-Regular.ttf",
    "DM Serif Display Italic": "DMSerifDisplay-Italic.ttf",
    "DM Serif Display Regular": "DMSerifDisplay-Regular.ttf",
    "Pacifico": "Pacifico-Regular.ttf",
    "Gravitas One": "GravitasOne-Regular.ttf",
    "Abril Fatface": "AbrilFatface-Regular.ttf",
    "Astloch Bold": "Astloch-Bold.ttf",
    "Astloch Regular": "Astloch-Regular.ttf",
    "Danfo": "Danfo-Regular-VariableFont_ELSH.ttf",
    "Mogra": "Mogra-Regular.ttf",
    "Aldrich": "Aldrich-Regular.ttf",
    "Geo Italic": "Geo-Italic.ttf",
    "Geo Regular": "Geo-Regular.ttf",
    "Jim Nightshade": "JimNightshade-Regular.ttf",
    "Luxurious Script": "LuxuriousScript-Regular.ttf",
    "Monoton": "Monoton-Regular.ttf",
    "Monsieur La Doulaise": "MounsieurLaDoulaise-Regular.ttf",
    "Rye": "Rye-Regular.ttf",
    "Smokum": "Smokum-Regular.ttf",
    "Special Elite": "SpecialElite-Regular.ttf",
    "UnifrakturMaguntia": "UnifrakturMaguntia-Regular.ttf",
    "Numbero Bold Italic": "Numbero-Bold-Italic.otf",
    "Numbero Bold": "Numbero-Bold.otf",
    "Numbero Italic": "Numbero-Italic.otf",
    "Numbero": "Numbero.otf"
};
 
const fonts = Object.keys(FONT_FILES);
 
// Creator per font family. þannig font name er matched eftir byrjun,
// þannig "Space Mono Bold Italic" finnur "Space Mono".
const CREATORS = {
    "Abril Fatface": "Veronika Burian, José Scaglione (TypeTogether)",
    "Aldrich": "Matthew Desmond",
    "AlienBlock": "Kensuke Uchida",
    "Archivo Black": "Hector Gatti",
    "Astloch": "Dan Rhatigan",
    "Bebas Neue": "Ryoichi Tsunekawa",
    "Bodoni": "Giambattista Bodoni",
    "Bold Analogue Sans": "Doni Purwoko",
    "Courier Prime": "Alan Dague-Greene",
    "Cudeco": "Ismael Eyþór Rodrigo Benitez",
    "Dancing Script": "Pablo Impallari",
    "Danfo": "Seyi Olusanya, David Udoh, Eyiyemi Adegbite, Mirko Velimirović",
    "DM Serif": "Colophon Foundry, Frank Grießhammer",
    "Fjalla One": "Irina Smirnova, Eben Sorkin",
    "Fredoka": "Milena Brandão, Hafontia",
    "Frutiger": "Adrian Frutiger",
    "Geo": "Ben Weiner",
    "Gravitas One": "Riccardo De Franceschi",
    "Helvetica": "Max Miedinger",
    "Idiqlat": "SIL International",
    "Imbue": "Tyler Finck",
    "Instrument Serif": "Rodrigo Fuenzalida, Jordan Egstad",
    "Jim Nightshade": "Astigmatic",
    "Lora": "Olga Karpushina, Alexei Vanyashin",
    "Luxurious Script": "Robert E. Leuschke",
    "Mea Culpa": "Robert E. Leuschke",
    "Mogra": "Lipi Raval",
    "Monoton": "Vernon Adams",
    "Monsieur La Doulaise": "Alejandro Paul",
    "Numbero": "Icep A. Fadhil, Figuree Studio",
    "Orbitron": "Matt McInerney",
    "Pacifico": "Vernon Adams, Jacques Le Bailly, Botjo Nikoltchev, Ani Petrova",
    "Play": "Jonas Hecksher",
    "Playfair Display": "Claus Eggers Sørensen",
    "Playwrite": "Veronika Burian, José Scaglione",
    "Pochaevsk": "Aleksandr Andreev",
    "Vielotta": "Shiddiq Roihan, Amorfatype Studios",
    "Weird Talks": "Salamahtype",
    "UnifrakturMaguntia": "j. 'mach' wust, Peter Wiegel, Carl Albert Fahrenwaldt",
    "VT323": "Peter Hull",
    "Rethink": "Hans Thiessen",
    "Rye": "Nicole Fally",
    "Sen": "Kosal Sen",
    "Smokum": "Astigmatic (Brian J. Bonislawsky)",
    "Space Mono": "Colophon Foundry, Benjamin Critton",
    "Special Elite": "Astigmatic (Brian J. Bonislawsky)",
    "Special Gothic": "Alistair McCready",
    "Squada One": "Joe Prince",
    "Sugar Magic Serif": "Doni Purwoko, Zeenesia Studio",
    "Tangerine": "Toshi Omagari",
    "Times New Roman": "Stanley Morison, Victor Lardent",
    "Wix Made for Text": "Dalton Maag",
    "Work Sans": "Wei Huang"
    //"Font family": "Creator"
};
 
function creatorOf(name) {
    const key = Object.keys(CREATORS)
        .filter((k) => name.startsWith(k))
        .sort((a, b) => b.length - a.length)[0];   // lengsta match vinnur
    return key ? CREATORS[key] : "";
}
 
// byggir allar @font face reglur frá const fonts
document.getElementById("font-faces").textContent = fonts.map((name) => {
    const [file, weight] = [].concat(FONT_FILES[name]);
    const format = file.endsWith(".otf") ? "opentype" : "truetype";
    return `@font-face{font-family:"${name}";src:url("fonts/${file}") format("${format}");` +
           `font-display:swap;${weight ? `font-weight:${weight};` : ""}}`;
}).join("\n");
 
// ---------------------------------------------------------------
// State og elements
// ---------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const outputs = [$("output"), $("output2")];
const lockImgs = [document.querySelector("#lock1 img"), document.querySelector("#lock2 img")];
const saveImg = document.querySelector("#saveBtn img");
const editImg = document.querySelector("#editBtn img");
const myFontsList = $("my-fonts-list");
 
const STORAGE_KEY = "myFontsSession";
const HOVER_TEXT = "The quick brown fox jumps over the lazy dog.";
 
const locked = [false, false];
const current = [null, null];      // núverandi font name per box
const customText = ["", ""];       // user text í edit mode
let editMode = false;
let sessionFonts = [];
 
// ---------------------------------------------------------------
// Saved pairings (sessionStorage)
// ---------------------------------------------------------------
function loadSessionFonts() {
    try {
        const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "[]");
        sessionFonts = Array.isArray(saved)
            ? saved.filter((p) => p && p.font1 && p.font2).map(({ font1, font2 }) => ({ font1, font2 }))
            : [];
    } catch {
        sessionFonts = [];
    }
}
 
function persistSessionFonts() {
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(sessionFonts)); } catch {}
    renderMyFonts();
    updateSaveButtonIcon();
}
 
const isPairSaved = (a, b) => sessionFonts.some((p) => p.font1 === a && p.font2 === b);
 
function applyFontStyles(el, name) {
    el.style.fontFamily = `"${name}"`;
    el.style.fontWeight = name === "Helvetica Light" ? "300" : "normal";
    el.style.fontStyle = /Italic|Oblique/.test(name) ? "italic" : "normal";
}
 
function renderMyFonts() {
    myFontsList.replaceChildren();
 
    if (!sessionFonts.length) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No saved pairings yet.";
        myFontsList.appendChild(empty);
        return;
    }
 
    const frag = document.createDocumentFragment();
    sessionFonts.forEach((pair, index) => {
        const card = document.createElement("div");
        card.className = "my-font-card";
 
        const content = document.createElement("div");
        content.className = "saved-pair-content";
        for (const name of [pair.font1, pair.font2]) {
            const line = document.createElement("div");
            line.className = "saved-pair-line";
 
            const span = document.createElement("span");
            span.className = "saved-pair-output";
            span.textContent = name;
            applyFontStyles(span, name);
            line.appendChild(span);
 
            const creator = creatorOf(name);
            if (creator) {
                const credit = document.createElement("span");
                credit.className = "saved-credit";
                credit.textContent = `by ${creator}`;
                line.appendChild(credit);
            }
 
            content.appendChild(line);
        }
 
        const remove = document.createElement("button");
        remove.className = "remove-pair-btn";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.dataset.index = index;
 
        card.append(content, remove);
        frag.appendChild(card);
    });
    myFontsList.appendChild(frag);
}
 
// SPACEBar mechanics, takkinn virkar ekki ef ert að skrifa, scrollar ekki, og focusar ekki elements sem voru ýtt á
myFontsList.addEventListener("click", (e) => {
    const btn = e.target.closest(".remove-pair-btn");
    if (!btn) return;
    sessionFonts.splice(Number(btn.dataset.index), 1);
    persistSessionFonts();
});
 
function updateSaveButtonIcon() {
    if (!current[0] || !current[1]) return;
    const saved = isPairSaved(current[0], current[1]);
    saveImg.src = saved ? "icons/saved.svg" : "icons/unsaved.svg";
    saveImg.alt = saved ? "Remove saved pairing" : "Save this pairing";
}
 
function saveCurrentPair() {
    const [font1, font2] = current;
    if (!font1 || !font2) return;
 
    sessionFonts = isPairSaved(font1, font2)
        ? sessionFonts.filter((p) => !(p.font1 === font1 && p.font2 === font2))
        : [{ font1, font2 }, ...sessionFonts];
 
    persistSessionFonts();
}
 
// ---------------------------------------------------------------
// Lock mechanism
// ---------------------------------------------------------------
function toggleLock(i) {
    locked[i] = !locked[i];
    lockImgs[i].src = locked[i] ? "icons/Asset 1.svg" : "icons/Asset 2.svg";
    lockImgs[i].alt = `${locked[i] ? "Lock" : "Unlock"} font ${i + 1}`;
}
 
// ---------------------------------------------------------------
// Randomizing
// ---------------------------------------------------------------
// Uniform random pick sem kemur í veg fyrir sömu aftur og aftur
function pickFont(exclude) {
    const pool = fonts.filter((f) => !exclude.includes(f));
    return pool[Math.floor(Math.random() * pool.length)];
}
 
function setFont(i, name) {
    current[i] = name;
    applyFontStyles(outputs[i], name);
    if (!editMode) outputs[i].textContent = name;
}
 
function randomFont() {
    if (locked[0] && locked[1]) return;
 
    // þegar unlocked þá verður næsta font aldrei það sem var núna,
    // þannig generate birtir alltaf new font
    for (const i of [0, 1]) {
        if (!locked[i]) setFont(i, pickFont(current));
    }
    updateSaveButtonIcon();
}
 
// ---------------------------------------------------------------
// Hover preview og edit mode
// ---------------------------------------------------------------
const previewing = [false, false];
 
function setPreview(i, on) {
    if (editMode || previewing[i] === on) return;
    previewing[i] = on;
    outputs[i].textContent = on ? HOVER_TEXT : current[i];
    outputs[i].style.fontSize = on ? "clamp(24px, 2.6vw, 50px)" : "";
}
 
document.querySelectorAll(".output-row").forEach((row, i) => {
    // mousemove (ekki mouseenter) þannig hovering á lock btn kveikir ekki á preview
    row.addEventListener("mousemove", (e) => setPreview(i, !e.target.closest(".lock-btn")));
    row.addEventListener("mouseleave", () => setPreview(i, false));
});
 
function toggleEditMode() {
    editMode = !editMode;
 
    outputs.forEach((el, i) => {
        el.classList.toggle("edit-mode", editMode);
        el.style.fontSize = "";
        if (editMode) {
            el.setAttribute("contenteditable", "true");
            el.textContent = customText[i];
        } else {
            customText[i] = el.textContent.trim();
            el.removeAttribute("contenteditable");
            el.textContent = current[i];
        }
    });
 
    editImg.src = editMode ? "icons/edit-on.svg" : "icons/edit-off.svg";
    editImg.alt = editMode ? "Show font names" : "Turn outputs into textboxes";
}
 
// ---------------------------------------------------------------
// Events
// ---------------------------------------------------------------
$("lock1").addEventListener("click", () => toggleLock(0));
$("lock2").addEventListener("click", () => toggleLock(1));
$("randomBtn").addEventListener("click", randomFont);
$("saveBtn").addEventListener("click", saveCurrentPair);
$("editBtn").addEventListener("click", toggleEditMode);
 
document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    if (e.target.closest?.("input, textarea, select, [contenteditable='true']") || e.target.isContentEditable) return;
 
    e.preventDefault();
    randomFont();
    document.activeElement?.blur?.();
});
 
// ---------------------------------------------------------------
// Init (script er í endann á body, svo the DOM is ready)
// ---------------------------------------------------------------
["icons/Asset 1.svg", "icons/saved.svg", "icons/edit-on.svg"].forEach((src) => { new Image().src = src; }); // preload swap icons
loadSessionFonts();
renderMyFonts();
randomFont();
// ---------------------------------------------------------------
// Logo: hver einasti stafur fær unique random font, sem breytist hverja sek
// ---------------------------------------------------------------
const logoEl = $("logoname");
logoEl.setAttribute("aria-label", logoEl.textContent);   // screen readers eru ennþa "RF-PG"
 
const logoLetters = [...logoEl.textContent].map((ch) => {
    const span = document.createElement("span");
    span.textContent = ch;
    span.setAttribute("aria-hidden", "true");
    return span;
});
logoEl.replaceChildren(...logoLetters);
 
function shuffleLogo() {
    // Fisher-Yates shuffle af copy af font listanum
    const pool = [...fonts];
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // letter i sækir pool[i], þannig engin 2 stafir nota sama font
    logoLetters.forEach((span, i) => applyFontStyles(span, pool[i]));
}
 
shuffleLogo();
setInterval(shuffleLogo, 900);
</script>
</body>
